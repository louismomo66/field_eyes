services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123456
      - DB_NAME=field_eyes
      - DSN=host=postgres port=5432 user=postgres password=postgres123456 dbname=field_eyes sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1884
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_CLIENT_ID=field_eyes_server
      - MQTT_TOPIC_ROOT=field_eyes/devices
      - JWT_SECRET=fieldeystuliSmartbalimi
      - JWT_SECRETE=fieldeystuliSmartbalimi
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=fieldeyes0@gmail.com
      - SMTP_PASSWORD=egby mdjt ultj dkwh
      - SMTP_FROM=fieldeyes0@gmail.com
      - PORT=9002
    ports:
      - "9002:9002"
    depends_on:
      - postgres
      - redis
      - mqtt

  postgres:
    image: 'postgres:15'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123456
      POSTGRES_DB: field_eyes
    ports:
      - "5432:5432"  # Map to host port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7'
    restart: always
    ports:
      - "6379:6379"  # Map to host port 6379
    volumes:
      - redis_data:/data

  mqtt:
    image: 'eclipse-mosquitto:2'
    restart: always
    ports:
      - "1884:1883"  # Map to host port 1883
      - "9001:9001"  # For MQTT WebSockets
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

volumes:
  postgres_data:
  redis_data:
  mqtt_data:
  mqtt_log: